<!DOCTYPE html>
<html>
<!-- reflow a paragraph mixing Hebrew and Latin at alternating widths (bidi) -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
pipelineBench({
    cycles: 10,
    setup: () => {
    sandbox().textContent = "";
    const p = document.createElement("p");
    p.style.width = "600px";
    p.textContent = "The word \u05e9\u05dc\u05d5\u05dd means peace and \u05ea\u05d5\u05d3\u05d4 means thanks. ".repeat(50);
    sandbox().appendChild(p);
    return p;
},
    mutate: (p, k) => {
    p.style.width = k & 1 ? "500px" : "600px";
},
});
</script>
</body>
</html>

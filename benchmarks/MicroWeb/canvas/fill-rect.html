<!DOCTYPE html>
<html>
<!-- small fillRect calls -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 20000,
    setup: () => {
    const ctx = canvas2d();
    ctx.fillStyle = "#336699";
    return ctx;
},
    run: (ctx, iters) => {
    for (let i = 0; i < iters; i++)
        ctx.fillRect((i * 37) % 800, (i * 91) % 600, 4, 4);
},
});
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<!-- beginPath + arc + fill scatter points -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 5000,
    setup: () => {
    const ctx = canvas2d();
    ctx.fillStyle = "rgba(54, 162, 235, 0.5)";
    return ctx;
},
    run: (ctx, iters) => {
    for (let i = 0; i < iters; i++) {
        ctx.beginPath();
        ctx.arc((i * 37) % 800, (i * 91) % 600, 3, 0, 2 * Math.PI);
        ctx.fill();
    }
},
});
</script>
</body>
</html>

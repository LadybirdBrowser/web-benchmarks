<!DOCTYPE html>
<html>
<!-- save + translate + restore cycle -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 20000,
    setup: () => canvas2d(),
    run: (ctx, iters) => {
    for (let i = 0; i < iters; i++) {
        ctx.save();
        ctx.translate(1, 1);
        ctx.restore();
    }
},
});
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<!-- globalAlpha + globalCompositeOperation change before each draw -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 10000,
    setup: () => {
    const ctx = canvas2d();
    ctx.fillStyle = "#573";
    return ctx;
},
    run: (ctx, iters) => {
    for (let i = 0; i < iters; i++) {
        ctx.globalAlpha = i & 1 ? 0.5 : 1.0;
        ctx.globalCompositeOperation = i & 1 ? "multiply" : "source-over";
        ctx.fillRect((i * 37) % 800, (i * 91) % 600, 4, 4);
    }
    ctx.globalAlpha = 1.0;
    ctx.globalCompositeOperation = "source-over";
},
});
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<!-- building small strings from numbers -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 100000,
    run: (ctx, iters) => {
    let acc = 0;
    for (let i = 0; i < iters; i++)
        acc += ("item " + (i & 1023)).length;
    if (!acc) throw new Error("bad result");
},
});
</script>
</body>
</html>

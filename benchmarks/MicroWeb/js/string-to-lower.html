<!DOCTYPE html>
<html>
<!-- toLowerCase of a mixed-case 100-char string -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 50000,
    setup: () => "AbCdEfGhIj".repeat(10),
    run: (s, iters) => {
    let acc = 0;
    for (let i = 0; i < iters; i++)
        acc += s.toLowerCase().length;
    if (!acc) throw new Error("bad result");
},
});
</script>
</body>
</html>

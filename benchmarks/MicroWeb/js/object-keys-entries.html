<!DOCTYPE html>
<html>
<!-- Object.keys + Object.entries of a 10-property object -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 20000,
    setup: () => Object.fromEntries(Array.from({ length: 10 }, (unused, i) => ["key" + i, i])),
    run: (obj, iters) => {
    let acc = 0;
    for (let i = 0; i < iters; i++)
        acc += Object.keys(obj).length + Object.entries(obj).length;
    if (!acc) throw new Error("bad result");
},
});
</script>
</body>
</html>

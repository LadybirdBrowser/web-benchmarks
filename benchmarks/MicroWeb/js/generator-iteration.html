<!DOCTYPE html>
<html>
<!-- iterating a generator producing 100 values -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 5000,
    setup: () => function* counter() {
    for (let i = 0; i < 100; i++)
        yield i;
},
    run: (counter, iters) => {
    let acc = 0;
    for (let i = 0; i < iters; i++) {
        for (const value of counter())
            acc += value;
    }
    if (!acc) throw new Error("bad result");
},
});
</script>
</body>
</html>

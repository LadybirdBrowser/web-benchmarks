<!DOCTYPE html>
<html>
<!-- Number.prototype.toFixed of chart-ish values -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 50000,
    run: (ctx, iters) => {
    let acc = 0;
    for (let i = 0; i < iters; i++)
        acc += ((i * 0.1234567) % 1000).toFixed(2).length;
    if (!acc) throw new Error("bad result");
},
});
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<!-- Float64Array fill + transform + reduce, 1000 elements -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 2000,
    setup: () => new Float64Array(1000),
    run: (data, iters) => {
    let acc = 0;
    for (let i = 0; i < iters; i++) {
        for (let j = 0; j < data.length; j++)
            data[j] = j * 0.5 + i;
        for (let j = 0; j < data.length; j++)
            acc += data[j];
    }
    if (!acc) throw new Error("bad result");
},
});
</script>
</body>
</html>

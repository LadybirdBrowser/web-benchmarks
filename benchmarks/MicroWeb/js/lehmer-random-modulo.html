<!DOCTYPE html>
<html>
<!-- Lehmer RNG step seed = seed * 16807 % 2147483647, whose product leaves the int32 range (StyleBench's random source) -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 1000000,
    run: (_, iters) => {
    let seed = 1, acc = 0;
    for (let i = 0; i < iters; i++) {
        seed = seed * 16807 % 2147483647;
        acc += seed % 1048576;
    }
    if (!acc) throw new Error("bad result");
},
});
</script>
</body>
</html>

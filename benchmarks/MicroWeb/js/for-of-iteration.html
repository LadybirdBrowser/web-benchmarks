<!DOCTYPE html>
<html>
<!-- for-of over a 1000-element array -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 5000,
    setup: () => Array.from({ length: 1000 }, (unused, i) => i),
    run: (data, iters) => {
    let acc = 0;
    for (let i = 0; i < iters; i++) {
        for (const value of data)
            acc += value;
    }
    if (!acc) throw new Error("bad result");
},
});
</script>
</body>
</html>

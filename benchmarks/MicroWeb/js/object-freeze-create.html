<!DOCTYPE html>
<html>
<!-- create small objects and arrays and Object.freeze them, then read through them (ProseMirror/TipTap immutable nodes and marks) -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 50000,
    run: (ctx, iters) => {
    let acc = 0;
    for (let i = 0; i < iters; i++) {
        const attrs = Object.freeze({ level: i & 3, id: null });
        const marks = Object.freeze([attrs]);
        acc += marks[0].level + (Object.isFrozen(marks) ? 1 : 0);
    }
    if (!acc) throw new Error("bad result");
},
});
</script>
</body>
</html>

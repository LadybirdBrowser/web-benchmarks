<!DOCTYPE html>
<html>
<!-- Map set/get/has over a cycling key space -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 20000,
    setup: () => new Map(),
    run: (map, iters) => {
    let acc = 0;
    for (let i = 0; i < iters; i++) {
        const key = "k" + (i & 255);
        map.set(key, i);
        acc += map.get(key) + (map.has(key) ? 1 : 0);
    }
    if (!acc) throw new Error("bad result");
},
});
</script>
</body>
</html>

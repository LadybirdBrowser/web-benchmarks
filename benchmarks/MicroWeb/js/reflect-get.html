<!DOCTYPE html>
<html>
<!-- Reflect.get with a receiver -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 100000,
    setup: () => ({ value: 42 }),
    run: (obj, iters) => {
    let acc = 0;
    for (let i = 0; i < iters; i++)
        acc += Reflect.get(obj, "value", obj);
    if (!acc) throw new Error("bad result");
},
});
</script>
</body>
</html>

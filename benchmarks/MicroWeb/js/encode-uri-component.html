<!DOCTYPE html>
<html>
<!-- encodeURIComponent + decodeURIComponent of a query-ish string -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 20000,
    run: (ctx, iters) => {
    let acc = 0;
    for (let i = 0; i < iters; i++)
        acc += decodeURIComponent(encodeURIComponent("name=todo item " + (i & 63) + "&done=true")).length;
    if (!acc) throw new Error("bad result");
},
});
</script>
</body>
</html>

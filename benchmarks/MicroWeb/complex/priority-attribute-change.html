<!DOCTYPE html>
<html>
<!-- change data-priority on one todo item, matched by app.css [data-priority] rules in the Complex-DOM page, then force layout -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
pipelineBench({
    cycles: 60,
    prepare: () => loadComplexDOM(),
    setup: (iteration, list) => fillTodoList(list, 100),
    mutate: (list, k) => {
    list.children[(k * 37) % 100].setAttribute("data-priority", String(k % 5));
},
});
</script>
</body>
</html>

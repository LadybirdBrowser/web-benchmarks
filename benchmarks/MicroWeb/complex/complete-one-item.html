<!DOCTYPE html>
<html>
<!-- toggle 'completed' on one of 100 todo items in the Complex-DOM page, then force layout (CompletingAllItems) -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
pipelineBench({
    cycles: 60,
    prepare: () => loadComplexDOM(),
    setup: (iteration, list) => fillTodoList(list, 100),
    mutate: (list, k) => {
    list.children[(k * 37) % 100].classList.toggle("completed");
},
});
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<!-- insert one new item into the middle of a 500-item list, then force layout -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
pipelineBench({
    cycles: 50,
    setup: () => buildList(500),
    mutate: (list, k) => {
    list.insertBefore(makeListItem(1000 + k, false), list.children[250]);
},
});
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<!-- change one label's text, then force layout -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
pipelineBench({
    cycles: 50,
    setup: () => buildList(500),
    mutate: (list, k) => {
    list.children[(k * 37) % 500].querySelector("label").textContent = "changed " + k;
},
});
</script>
</body>
</html>

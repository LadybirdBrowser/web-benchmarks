<!DOCTYPE html>
<html>
<!-- remove 100 random leaves of a StyleBench-shaped 5000-element inline-block tree with a 5000-rule sheet, then force layout -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
pipelineBench({
    cycles: 1,
    setup: () => {
    injectInlineBlockStyle();
    injectStyleOnce("rules", makeRuleSheetText(5000));
    sandbox().textContent = "";
    sandbox().appendChild(makeInlineBlockTree(5000));
    forceLayout();
    return { leaves: [...sandbox().querySelectorAll("*")].filter((e) => !e.firstChild), random: seededRandom(5) };
},
    mutate: ({ leaves, random }) => {
    for (let i = 0; i < 100; i++) {
        const index = random(leaves.length);
        leaves[index].remove();
        leaves[index] = leaves[leaves.length - 1];
        leaves.pop();
    }
},
});
</script>
</body>
</html>

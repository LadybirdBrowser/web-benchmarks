<!DOCTYPE html>
<html>
<!-- toggle display:none on one item of a 500-item list, then force layout -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
pipelineBench({
    cycles: 50,
    setup: () => buildList(500),
    mutate: (list, k) => {
    list.children[(k * 37) % 500].classList.toggle("hidden-item");
},
});
</script>
</body>
</html>

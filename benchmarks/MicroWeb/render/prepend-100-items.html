<!DOCTYPE html>
<html>
<!-- insertBefore(item, list.firstChild) 100 times, then force layout once -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
pipelineBench({
    cycles: 5,
    setup: () => buildList(0),
    mutate: (list, k) => {
    list.textContent = "";
    for (let i = 0; i < 100; i++)
        list.insertBefore(makeTodoItem(i, false), list.firstChild);
},
});
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<!-- Redux/useReducer toggle: todos.map(t => t.id === id ? {...t, completed: !t.completed} : t) over 100 todos -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 2000,
    setup: () => {
    const todos = [];
    for (let i = 0; i < 100; i++) todos.push({ id: "t" + i, title: todoTitle(i), completed: false, priority: i % 5 });
    return todos;
},
    run: (todos, iters) => {
    let state = todos;
    for (let i = 0; i < iters; i++) {
        const id = "t" + (i % 100);
        state = state.map((t) => (t.id === id ? { ...t, completed: !t.completed } : t));
    }
    if (state.length !== 100) throw new Error("bad result");
},
});
</script>
</body>
</html>

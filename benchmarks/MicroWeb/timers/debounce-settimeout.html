<!DOCTYPE html>
<html>
<!-- debounce: clearTimeout + setTimeout(fn, 0) 5000 times, then wait for the one surviving callback (Backbone _.debounce(render, 0)) -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 1,
    run: (ctx, iters) => new Promise((resolve) => {
    let timer = 0, fired = 0;
    for (let i = 0; i < 5000; i++) {
        clearTimeout(timer);
        timer = setTimeout(() => { fired++; resolve(); }, 0);
    }
}),
});
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<!-- querySelector('.needle') matching late in a 200-element list -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 5000,
    setup: () => {
    const list = buildList(200);
    list.children[150].classList.add("needle");
},
    run: (ctx, iters) => {
    for (let i = 0; i < iters; i++)
        document.querySelector(".needle");
},
});
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<!-- textContent read of one todo item subtree (label text lookups in framework tests/drivers) -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 50000,
    setup: () => Array.from(buildList(100).children),
    run: (items, iters) => {
    let acc = 0;
    for (let i = 0; i < iters; i++)
        acc += items[i % 100].textContent.length;
    if (!acc) throw new Error("bad result");
},
});
</script>
</body>
</html>

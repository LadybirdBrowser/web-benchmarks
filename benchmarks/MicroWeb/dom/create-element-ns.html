<!DOCTYPE html>
<html>
<!-- createElementNS in the SVG namespace -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 20000,
    run: (ctx, iters) => {
    for (let i = 0; i < iters; i++)
        document.createElementNS("http://www.w3.org/2000/svg", "path");
},
});
</script>
</body>
</html>

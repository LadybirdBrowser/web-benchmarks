<!DOCTYPE html>
<html>
<!-- dataset property read -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 50000,
    setup: () => {
    const el = document.createElement("div");
    el.dataset.foo = "bar";
    return el;
},
    run: (el, iters) => {
    let acc = 0;
    for (let i = 0; i < iters; i++)
        acc += el.dataset.foo.length;
    if (!acc) throw new Error("bad result");
},
});
</script>
</body>
</html>

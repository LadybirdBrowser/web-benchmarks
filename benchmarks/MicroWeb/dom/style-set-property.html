<!DOCTYPE html>
<html>
<!-- style.setProperty('color', ...) on a detached element -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 20000,
    setup: () => document.createElement("div"),
    run: (el, iters) => {
    for (let i = 0; i < iters; i++)
        el.style.setProperty("color", i & 1 ? "red" : "blue");
},
});
</script>
</body>
</html>

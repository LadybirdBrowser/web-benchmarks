<!DOCTYPE html>
<html>
<!-- appendChild + remove cycle on detached nodes -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 50000,
    setup: () => ({ parent: document.createElement("ul"), child: document.createElement("li") }),
    run: (ctx, iters) => {
    for (let i = 0; i < iters; i++) {
        ctx.parent.appendChild(ctx.child);
        ctx.child.remove();
    }
},
});
</script>
</body>
</html>

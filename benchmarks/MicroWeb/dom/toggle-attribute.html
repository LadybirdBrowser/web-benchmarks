<!DOCTYPE html>
<html>
<!-- toggleAttribute of a boolean attribute -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 50000,
    setup: () => document.createElement("div"),
    run: (el, iters) => {
    for (let i = 0; i < iters; i++)
        el.toggleAttribute("hidden");
},
});
</script>
</body>
</html>

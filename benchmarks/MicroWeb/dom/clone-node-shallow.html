<!DOCTYPE html>
<html>
<!-- cloneNode(false) of one element with attributes -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 50000,
    setup: () => {
    const el = document.createElement("div");
    el.className = "a b c";
    el.setAttribute("data-id", "42");
    return el;
},
    run: (el, iters) => {
    for (let i = 0; i < iters; i++)
        el.cloneNode(false);
},
});
</script>
</body>
</html>

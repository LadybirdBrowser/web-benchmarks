<!DOCTYPE html>
<html>
<!-- setAttribute with a cycling value on a detached element -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 50000,
    setup: () => document.createElement("div"),
    run: (el, iters) => {
    for (let i = 0; i < iters; i++)
        el.setAttribute("data-x", "v" + (i & 7));
},
});
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<!-- list.querySelector('[data-id="N"]') with the selector string built per lookup (ES5/ES6 TodoMVC qs) -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 15000,
    setup: () => fillTodoList(buildList(0), 100),
    run: (list, iters) => {
    let acc = 0;
    for (let i = 0; i < iters; i++)
        acc += list.querySelector('[data-id="' + (i % 100) + '"]').childElementCount;
    if (acc !== iters) throw new Error("bad result");
},
});
</script>
</body>
</html>

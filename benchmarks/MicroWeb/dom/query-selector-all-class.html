<!DOCTYPE html>
<html>
<!-- querySelectorAll('.toggle') collecting 200 matches -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 2000,
    setup: () => buildList(200),
    run: (ctx, iters) => {
    let acc = 0;
    for (let i = 0; i < iters; i++)
        acc += document.querySelectorAll(".toggle").length;
    if (!acc) throw new Error("bad result");
},
});
</script>
</body>
</html>

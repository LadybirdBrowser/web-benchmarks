<!DOCTYPE html>
<html>
<!-- toggle a <body> class that no selector references over a 500-item list, then force layout -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
pipelineBench({
    cycles: 50,
    setup: () => buildList(500),
    mutate: (list, k) => {
    document.body.classList.toggle("unused-state-class");
},
});
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<!-- innerHTML of a ~1KB 10-item list on a detached div -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
microbench({
    iters: 2000,
    setup: () => ({ el: document.createElement("div"), markup: "<ul>" + listHTML(10) + "</ul>" }),
    run: (ctx, iters) => {
    for (let i = 0; i < iters; i++)
        ctx.el.innerHTML = ctx.markup;
},
});
</script>
</body>
</html>

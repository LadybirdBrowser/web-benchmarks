<!DOCTYPE html>
<html>
<!-- create 500 <circle> elements with cx/cy/r/fill-opacity attributes (observable-plot Dotted), then force layout -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
pipelineBench({
    cycles: 3,
    setup: () => makeSVG(0),
    mutate: (svg, k) => {
    svg.textContent = "";
    const g = document.createElementNS(SVG_NS, "g");
    g.setAttribute("stroke", "currentColor");
    for (let i = 0; i < 500; i++) {
        const c = document.createElementNS(SVG_NS, "circle");
        c.setAttribute("cx", String((i * 37 + k) % 600));
        c.setAttribute("cy", String((i * 91) % 300));
        c.setAttribute("r", String(1 + (i % 7) ** 0.2 * 3));
        c.setAttribute("fill-opacity", "0.5");
        g.appendChild(c);
    }
    svg.appendChild(g);
},
});
</script>
</body>
</html>

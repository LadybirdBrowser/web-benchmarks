<!DOCTYPE html>
<html>
<!-- rotate 50 axis labels via transform, then force layout -->
<body>
<div id="sandbox"></div>
<script src="../resources/micro.js"></script>
<script>
pipelineBench({
    cycles: 10,
    setup: () => {
    const svg = makeSVG(0);
    for (let i = 0; i < 50; i++) {
        const text = document.createElementNS(SVG_NS, "text");
        text.setAttribute("x", String(i * 12));
        text.setAttribute("y", "150");
        text.textContent = "lbl" + i;
        svg.appendChild(text);
    }
    return svg;
},
    mutate: (svg, k) => {
    const labels = svg.children;
    for (let i = 0; i < labels.length; i++)
        labels[i].setAttribute("transform", "rotate(" + (k & 1 ? -45 : -30) + " " + i * 12 + " 150)");
},
});
</script>
</body>
</html>
